[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentefino-intel"
version = "0.5.0"
description = "PenteFino Threat Intelligence Enrichment (FIRST EPSS v4, CISA KEV, OSV.dev)"
requires-python = ">=3.11"
authors = [
    { name = "PenteFino Core Team" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pentefino_intel"]
