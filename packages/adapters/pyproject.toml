[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentefino-adapters"
version = "0.1.0"
description = "PenteFino Asset Discovery & Reconnaissance Adapters (Subfinder, dnsx, httpx)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PenteFino Core Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pentefino-domain",
    "pentefino-scope",
    "pentefino-runner",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pentefino_adapters"]
