[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentefino-detection"
version = "0.1.0"
description = "PenteFino Detection Planner, Hardened Nuclei Runner, and Finding Normalizer"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PenteFino Core Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pentefino-domain",
    "pentefino-runner",
    "pentefino-template-indexer",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pentefino_detection"]
