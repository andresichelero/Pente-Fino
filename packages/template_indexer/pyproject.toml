[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentefino-template-indexer"
version = "0.1.0"
description = "PenteFino Nuclei Template Catalog Indexer and Static AST Impact Classifier"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pentefino-domain",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pentefino_template_indexer"]
