[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pentefino-scope"
version = "0.1.0"
description = "Hard-gate fail-closed scope engine for PenteFino attack surface management"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PenteFino Core Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "dnspython>=2.4.0",
    "idna>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pentefino_scope*"]
