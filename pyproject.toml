[project]
name = "pentefino-workspace"
version = "0.5.0"
description = "PenteFino Governed Bug Bounty & SecOps Platform Monorepo Workspace"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "packages/domain",
    "packages/scope",
    "packages/runner",
    "packages/template_indexer",
    "packages/adapters",
    "packages/detection",
    "packages/intel",
    "packages/notifications",
    "apps/api",
    "apps/cli",
    "apps/proxy",
    "apps/worker",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
    "apps/cli/tests",
    "apps/api/tests",
]
pythonpath = [
    ".",
    "packages/domain",
    "packages/scope",
    "packages/runner",
    "packages/template_indexer",
    "packages/adapters",
    "packages/detection",
    "packages/intel",
    "packages/notifications",
    "apps/api",
    "apps/cli",
    "apps/proxy",
    "apps/worker",
]

[tool.ruff.lint]
# Same rule set the baseline audit ran with (ruff defaults without a project config).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Windows event-loop policy and dotenv must be configured before the app imports.
"apps/api/pentefino_api/main.py" = ["E402"]
"apps/cli/pentefino_cli/main.py" = ["E402"]
