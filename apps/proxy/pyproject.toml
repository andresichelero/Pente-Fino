[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentefino-proxy"
version = "0.5.0"
description = "PenteFino Governed HTTP/HTTPS Egress Proxy with Fail-Closed ScopeGuard, Valkey Rate Limiter, and Forensic Evidence Tap"
requires-python = ">=3.11"
authors = [
    { name = "PenteFino Core Team" }
]
dependencies = [
    "aiohttp>=3.10.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pentefino_proxy"]
