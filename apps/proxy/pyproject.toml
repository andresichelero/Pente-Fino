[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pentefino-proxy"
version = "0.1.0"
description = "Traffic Control Plane & Forward Egress Proxy for PenteFino"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pentefino-scope",
    "aiohttp>=3.9.0",
    "redis>=5.0.0",
    "valkey>=6.0.0",
    "boto3>=1.30.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pentefino_proxy*"]
