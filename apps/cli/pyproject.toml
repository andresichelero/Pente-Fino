[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentefino-cli"
version = "0.1.0"
description = "PenteFino Management CLI Interface (pentefino)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PenteFino Core Team" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "pentefino-domain",
    "pentefino-scope",
    "pentefino-adapters",
    "pentefino-template-indexer",
    "pentefino-detection",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
pentefino = "pentefino_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["pentefino_cli"]
