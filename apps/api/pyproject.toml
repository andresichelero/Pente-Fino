[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentefino-api"
version = "0.1.0"
description = "PenteFino FastAPI Backend & WebSockets Server"
requires-python = ">=3.11"
authors = [
    { name = "PenteFino Core Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["pentefino_api"]
