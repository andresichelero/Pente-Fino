name: pentefino

services:
  # ============================================================================
  # PostgreSQL 16 Relational Persistence Store with pgcrypto
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: pentefino_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pentefino}
      POSTGRES_USER: ${POSTGRES_USER:-pentefino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pentefino_secure_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    networks:
      pentefino-net:
        aliases:
          - postgres
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pentefino} -d ${POSTGRES_DB:-pentefino}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Valkey 7.2 In-Memory Token-Bucket Rate Limiter & Concurrency Cache (BSD-3-Clause)
  # ============================================================================
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: pentefino_valkey
    restart: unless-stopped
    command: >
      valkey-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --dir /data
    volumes:
      - valkey_data:/data
    ports:
      - "${BIND_IP:-127.0.0.1}:${VALKEY_PORT:-6379}:6379"
    networks:
      pentefino-net:
        aliases:
          - valkey
          - cache
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================================
  # SeaweedFS Local S3-Compatible Object Store & Filer (Apache-2.0)
  # ============================================================================
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: pentefino_seaweedfs
    restart: unless-stopped
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -filer=true
      -volume.max=100
      -master.volumeSizeLimitMB=1024
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "${BIND_IP:-127.0.0.1}:${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "${BIND_IP:-127.0.0.1}:${SEAWEEDFS_MASTER_PORT:-9333}:9333"
      - "${BIND_IP:-127.0.0.1}:${SEAWEEDFS_FILER_PORT:-8888}:8888"
    networks:
      pentefino-net:
        aliases:
          - seaweedfs
          - s3
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # RabbitMQ 3.13 AMQP Message Broker & Management UI
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pentefino_rabbitmq
    restart: unless-stopped
    hostname: pentefino-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-pentefino}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-pentefino_rabbit_pass}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/pentefino}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${BIND_IP:-127.0.0.1}:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${BIND_IP:-127.0.0.1}:${RABBITMQ_MGMT_PORT:-15672}:15672"
    networks:
      pentefino-net:
        aliases:
          - rabbitmq
          - broker
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  pentefino-net:
    driver: bridge
    name: pentefino-net
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

# ==============================================================================
# Named Persistent Storage Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: pentefino_postgres_data
  valkey_data:
    name: pentefino_valkey_data
  seaweedfs_data:
    name: pentefino_seaweedfs_data
  rabbitmq_data:
    name: pentefino_rabbitmq_data
